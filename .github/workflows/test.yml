name: Test
run-name: Flatpak scheme regression ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheme:
    name: Flatpak scheme regression (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reproduce on the unmodified implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          tmp = Path(os.environ["RUNNER_TEMP"])
          source = "internal/gui/scheme_linux.go"
          old = tmp / "scheme_linux_before.go"
          old.write_bytes(subprocess.check_output(["git", "show", "HEAD~2:" + source]))
          overlay = tmp / "scheme-before.json"
          overlay.write_text(json.dumps({"Replace": {str(root / source): str(old)}}))
          result = subprocess.run([
              "go", "test", "-tags", "nogui", "-overlay", str(overlay),
              "./internal/gui", "-run", "^TestRegisterScheme$", "-count=1", "-json"
          ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, end="")
          events = []
          for line in result.stdout.splitlines():
              if line.startswith("{"):
                  events.append(json.loads(line))
          failed = {e["Test"] for e in events if e.get("Action") == "fail" and "Test" in e}
          passed = {e["Test"] for e in events if e.get("Action") == "pass" and "Test" in e}
          expected_failures = {
              "TestRegisterScheme",
              "TestRegisterScheme/flatpak_without_entry",
              "TestRegisterScheme/flatpak_with_entry",
          }
          expected_passes = {
              "TestRegisterScheme/native_without_entry",
              "TestRegisterScheme/native_with_entry",
          }
          if result.returncode != 1 or failed != expected_failures or passed != expected_passes:
              sys.exit("Old-code run did not produce exactly the expected regression failures")
          print("Confirmed: old code fails both Flatpak cases and passes both native cases.")
          PY
      - name: Verify the fixed implementation
        run: go test -tags nogui ./internal/gui -run '^TestRegisterScheme$' -v -count=1
      - name: Vet the Linux GUI package
        run: go vet -tags nogui ./internal/gui
      - name: Run the Linux GUI package tests
        run: go test -tags nogui ./internal/gui -count=1 -timeout 8m
